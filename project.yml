name: TimeTrack

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    # --- Change these three for your account -------------------------------
    DEVELOPMENT_TEAM: ""
    BUNDLE_ID_BASE: com.example.timetrack
    APP_GROUP_ID: group.com.example.timetrack
    # ------------------------------------------------------------------------
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  TimeTrack:
    type: application
    platform: iOS
    sources:
      - TimeTrack
      - Shared
    info:
      path: TimeTrack/Info.plist
      properties:
        CFBundleDisplayName: TimeTrack
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: TimeTrack/TimeTrack.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: TimeTrackWidget

  TimeTrackWidget:
    type: app-extension
    platform: iOS
    sources:
      - TimeTrackWidget
      - Shared
    info:
      path: TimeTrackWidget/Info.plist
      properties:
        CFBundleDisplayName: TimeTrack
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TimeTrackWidget/TimeTrackWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).widget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
